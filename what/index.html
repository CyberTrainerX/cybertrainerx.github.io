<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Roll!</title>
    <style>
        {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: monospace;
        }
        .player-container {
            background: #ffffff; /* 白底 */
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            border-radius: 0;
            box-shadow: none;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            display: block;
        }

        .caption {
            color: #888888;
            text-align: center;
            margin-top: 12px;
            font-size: 0.9rem;
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.7);
            padding: 6px 12px;
            width: fit-content;
            margin: 0 auto;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <video controls autoplay playsinline preload="metadata">
            <source src="leakedMaterials.mp4" type="video/mp4">
            Cannot Play the video, maybe the browser unsupported.
        </video>
        <div class="caption">Rick Roll!</div>
    </div>
</body>
</html>
