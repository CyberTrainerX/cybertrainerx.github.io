<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #c0c5ce;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #141a20;
            padding: 40px 30px;
            border-radius: 16px;
            border: 1px solid #2c3e44;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: 400;
            color: #e0e6ed;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #8a9ba8;
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .btn {
            padding: 10px 30px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            color: white;
            display: inline-block;
        }
        .btn-yes {
            background: #1e7e34;
        }
        .btn-yes:hover {
            background: #2a9c46;
        }
        .btn-no {
            background: #7e2e2e;
        }
        .btn-no:hover {
            background: #a33a3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Are you sure?</h1>
        <p>You are about to access a secret area.<br>Do you really want to proceed?</p>
        <div class="buttons">
            <a href="crashscreen.html" class="btn btn-yes">Yes</a>
            <a href="/" class="btn btn-no">No</a>
        </div>
    </div>
</body>
</html>
