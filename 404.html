<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #c0c5ce;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }
        .container {
            max-width: 720px;
            width: 100%;
            background: #141a20;
            padding: 35px 30px;
            border-radius: 16px;
            border: 1px solid #2a343e;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            font-size: 5rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #e0e6ed;
            line-height: 1;
            margin-bottom: 16px;
        }
        .msg {
            font-size: 1.1rem;
            color: #8a9ba8;
            margin-bottom: 6px;
        }
        .msg-sub {
            font-size: 0.9rem;
            color: #6c8b9b;
            margin-bottom: 28px;
        }
        .video-wrapper {
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-bottom: 24px;
        }
        video {
            width: 100%;
            display: block;
            background: #000;
        }
        .footer {
            font-size: 0.75rem;
            color: #4a5a6a;
            border-top: 1px solid #1e242a;
            padding-top: 15px;
            margin-top: 6px;
        }
        .footer a {
            color: #66b8ff;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <div class="msg">Page Not Found</div>
        <div class="msg-sub">You definitely got tricked 😏</div>

        <div class="video-wrapper">
            <video controls autoplay playsinline preload="metadata">
                <source src="/rickroll.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="footer">
            <a href="/">🏠 Home</a> · 
            <a href="https://github.com/CyberTrainerX/cybertrainerx.github.io" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
