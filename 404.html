<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在 · 404</title>
<style>
  :root {
    --bg: #f7f5f0;
    --ink: #222;
    --muted: #777;
    --line: #ddd;
    --accent: #5b4b8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  h1 { font-size: 2rem; margin: 0 0 .4em; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .box {
    background: #fff;
    border: 1px solid var(--line);
    padding: 24px;
    margin-top: 24px;
  }
  blockquote {
    margin: 1.2em 0;
    padding-left: 1em;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>404</h1>
  <p class="muted">你访问的页面不存在。</p>

  <div id="normal">
    <div class="box">
      <p>这里没有你要找的页面。</p>
      <p><a id="homeLink" href="/args/rzkxsys/">返回首页</a></p>
    </div>
  </div>

  <div id="special" class="hidden">
    <div class="box">
      <h2>编号 13 · 已归档</h2>
      <blockquote>
        姓名：林晚<br>
        状态：已编码<br>
        备注：异常编号。档案不在公开目录中。
      </blockquote>
      <p>如果你是在找她留下的东西，<a id="vaultLink" href="/vault.html">去 vault</a>。</p>
      <p class="muted">口令不在这一页。</p>
    </div>
  </div>
</div>

<script>
  const BASE = '/';

  const path = location.pathname.replace(/\/+$/, '');
  const isSubject13 = path.endsWith('/subjects/13');

  document.getElementById('homeLink').href = BASE;
  document.getElementById('vaultLink').href = BASE + 'vault.html';

  if (isSubject13) {
    document.getElementById('normal').classList.add('hidden');
    document.getElementById('special').classList.remove('hidden');
    document.title = '编号 13 · 已归档';
  }
</script>
</body>
</html>
