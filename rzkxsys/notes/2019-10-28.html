    <h2>回收率与白色记忆</h2>

    <p>回收率仍然只有 41%。未回收的记忆并没有消失，它们只是没有被编码进可检索的位置。</p>
    <p>我把这种现象叫作“白色记忆”：存在于背景里，和背景同色。只有选中它，才会短暂显形。</p>
    <p>观察室的墙是白色的。有时候我觉得，墙上也写着东西。</p>
    <p>今天录了一段新的环境音，频率标记留在了原始档的校验行里。</p>
