<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vault · 受保护</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>vault</h1>
    <p class="sub">受保护页面 · 仅限有口令者</p>
  </header>

  <main>
    <p>这里归档的是不适合公开的实验记录。</p>

    <div class="vault-box" id="vaultBox">
      <form id="vaultForm">
        <label for="password">访问口令</label>
        <input type="password" id="password" name="password" autocomplete="off" placeholder="输入口令">
        <button type="submit">进入</button>
      </form>
      <p class="error" id="error"></p>
    </div>

    <div class="success hidden" id="success">
      <h2>访问已授予</h2>
      <p>你打开了 vault。第 13 号受试者的档案只有一页：</p>
      <blockquote>
        编号：13<br>
        姓名：林晚<br>
        状态：已编码<br>
        备注：她把自己写进了第 12 次实验，然后删除了检索路径。
      </blockquote>
      <p>2019-11-03 之后，笔记停止更新。</p>
    </div>
  </main>

  <footer>
    <p>© 2019 林晚</p>
  </footer>
</div>

<script>
  const PASSWORD = 'LW-1103';

  const form = document.getElementById('vaultForm');
  const input = document.getElementById('password');
  const error = document.getElementById('error');
  const vaultBox = document.getElementById('vaultBox');
  const success = document.getElementById('success');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value.trim() === PASSWORD) {
      vaultBox.classList.add('hidden');
      success.classList.remove('hidden');
    } else {
      error.textContent = '口令错误。白色里的东西，选中才能看见。';
    }
  });
</script>
</body>
</html>
