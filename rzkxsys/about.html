    <h2>关于我</h2>
    <p>我叫林晚，做记忆编码方向的研究。简单说，就是研究人怎样把一段经历放进可以再次取出的位置。</p>
    <p>实验受试者编号从 01 开始，按报名顺序分配。第 12 次实验的名单上，13 号一直空着。</p>

    <h2>关于实验室</h2>
    <p>实验室只有我一个人。设备不多，一台旧录音机，一台用于播放环境音的电脑，以及一间墙面刷成白色的观察室。</p>
    <p>我记性不好，验证码从来不写在一个地方，也不写在能直接看见的地方。原始档里留着建站时的校验行，那是我留给自己的记号。</p>
    <p class="notice">白色不是装饰。白色是未编码记忆的颜色。</p>
