<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 8rem;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 4px;
            margin-bottom: 1rem;
            line-height: 1;
        }
        p {
            font-size: 1.5rem;
            color: #4a627a;
            margin-bottom: 2rem;
            font-weight: 400;
        }
        .hint {
            font-size: 1rem;
            color: #7f8c8d;
            border-top: 1px solid #dce4ec;
            padding-top: 1.5rem;
            margin-top: 0.5rem;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Page not found</p>
        <div class="hint">
            🤔 The page you're looking for doesn't exist.<br>
            Maybe it was moved or you typed the address wrong.
        </div>
    </div>
</body>
</html>
