<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统崩溃</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a2a8c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            color: white;
            padding: 40px;
        }
        .bsod {
            max-width: 700px;
            background: #0a2a8c;
            border: 3px solid #ffffff;
            padding: 40px;
        }
        .bsod h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .bsod p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        .bsod .blink {
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .progress {
            margin-top: 20px;
            background: #ffffff20;
            height: 20px;
            width: 100%;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            animation: loading 4s forwards;
        }
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="bsod" id="bsod">
        <h1>💀 系统崩溃</h1>
        <p>检测到严重错误：<span style="color:#ffaa00;">PAGE_FAULT_IN_NONPAGED_AREA</span></p>
        <p>错误代码：0x00000050 (0xFFFFF800, 0x000000, 0x000000, 0x000000)</p>
        <p>系统将在 <span id="countdown">5</span> 秒后自动重启...</p>
        <div class="progress">
            <div class="progress-bar"></div>
        </div>
        <p style="margin-top: 20px; font-size: 0.8rem; color: #aaccff;">
            请勿关闭电源。正在转储内存...
            <span class="blink">█</span>
        </p>
    </div>
    <script>
        let seconds = 5;
        const countdown = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/';
            }
        }, 1000);
    </script>
</body>
</html>
