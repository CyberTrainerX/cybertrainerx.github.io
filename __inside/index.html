<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nothing here</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c10;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .message {
            max-width: 500px;
        }
        p {
            font-size: 1.3rem;
            color: #c0c5ce;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .leave {
            font-size: 1rem;
            color: #8a9ba8;
            border-top: 1px solid #2c3e44;
            padding-top: 1rem;
            margin-top: 0.5rem;
        }
        a {
            color: #6c8b9b;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="message">
        <p>There's nothing here,<br>and certainly not the information you're looking for.</p>
        <p class="leave">Leave now.</p>
    </div>
</body>
</html>
